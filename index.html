<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Deviation Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 20px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
        button.stop { background-color: #dc3545; }
        button.submit { background-color: #28a745; font-weight: bold; }
        button.log { background-color: #6c757d; }

        input[type="number"] {
            padding: 6px;
            width: 70px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #timer {
            font-size: 1.2em;
            font-weight: bold;
            margin-left: auto;
            color: #d9534f;
        }
        #timer.times-up {
            color: #dc3545;
            font-size: 1.4em;
        }

        #results-summary {
            display: none;
            background: #e9ecef;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #28a745;
        }
        .summary-stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; color: #333; display: block;}
        .stat-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px;}

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #f8f9fa; font-weight: bold; }
        .string-cell {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 15px;
        }
        
        .diff-highlight {
            background-color: #ffcccc;
            color: #cc0000;
            border-radius: 3px;
            padding: 0 2px;
        }

        .radio-label {
            display: block;
            padding: 4px 8px;
            border-radius: 4px;
            margin: 2px 0;
            transition: all 0.2s;
        }
        .radio-correct {
            background-color: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            font-weight: bold;
        }
        .radio-wrong {
            background-color: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            text-decoration: line-through;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            width: 80%;
            max-width: 700px;
            border-radius: 8px;
        }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <label for="numQuestionsInput">Questions:</label>
        <input type="number" id="numQuestionsInput" value="10" min="1" max="100">
        
        <button id="btnGenerate" onclick="generateQuiz()">Generate & Start</button>
        <button id="btnStop" class="stop" onclick="stopCountdown()" disabled style="display:none;">Stop Timer</button>
        <button id="btnScore" class="submit" onclick="scoreQuiz()" disabled>Submit Quiz</button>
        <button class="log" onclick="showLog()">View Score Log</button>
        
        <span id="timer">Time Remaining: -- sec</span>
    </div>

    <div id="results-summary">
        <div class="summary-stats">
            <div><span class="stat-value" id="res-score">0/10</span><span class="stat-label">Score</span></div>
            <div><span class="stat-value" id="res-accuracy">0%</span><span class="stat-label">Accuracy</span></div>
            <div><span class="stat-value" id="res-time">0s</span><span class="stat-label">Time Used</span></div>
            <div><span class="stat-value" id="res-missing">0</span><span class="stat-label">Missing</span></div>
        </div>
    </div>

    <table id="quizTable">
        <thead>
            <tr>
                <th>Question</th>
                <th>String 1</th>
                <th>String 2</th>
                <th>Your Answer</th>
                <th>No-deviate</th>
                <th>1 deviate</th>
                <th>2 deviate</th>
                <th>3 deviate</th>
                <th>4 or more deviate</th>
            </tr>
        </thead>
        <tbody id="quizBody">
        </tbody>
    </table>
</div>

<div id="logModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeLog()">&times;</span>
        <h2>Score Log</h2>
        <table id="logTable">
            <thead>
                <tr>
                    <th>Date/Time</th>
                    <th>Score</th>
                    <th>Total</th>
                    <th>Time Allowed</th>
                    <th>Time Used</th>
                    <th>Missing</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>
</div>

<script>
    let correctAnswers = [];
    let numQuestions = 10;
    let stopTimer = false;
    let quizStartTime = null;
    let timerInterval = null;
    let totalAllowedTime = 0;
    let isScored = false; 

    function generateQuiz() {
        let input = document.getElementById("numQuestionsInput").value;
        if (!input || input <= 0 || isNaN(input)) {
            alert("Please enter a valid number of questions.");
            return;
        }

        numQuestions = parseInt(input);
        totalAllowedTime = numQuestions * 15;

        const tbody = document.getElementById("quizBody");
        tbody.innerHTML = "";
        correctAnswers = [];
        isScored = false;
        
        clearInterval(timerInterval);
        let timerEl = document.getElementById("timer");
        timerEl.innerText = "Time Remaining: -- sec";
        timerEl.classList.remove('times-up');
        
        document.getElementById("btnScore").disabled = true;
        document.getElementById("btnStop").style.display = "none";
        document.getElementById("results-summary").style.display = "none"; 

        for (let i = 1; i <= numQuestions; i++) {
            let len = Math.floor(Math.random() * (14 - 10 + 1)) + 10;
            let str1 = randomMixedString(len);
            let str2 = makeSimilarString(str1);
            let correctCat = getDeviationCategory(str1, str2);
            
            correctAnswers.push(correctCat);

            let row = `<tr id="row-${i}">
                <td>Q${i}</td>
                <td class="string-cell" id="str1-${i}">${str1}</td>
                <td class="string-cell" id="str2-${i}">${str2}</td>
                <td id="ans-${i}"></td>
                <td><label class="radio-label"><input type="radio" name="q${i}" value="No-deviate"> No-deviate</label></td>
                <td><label class="radio-label"><input type="radio" name="q${i}" value="1 deviate"> 1 deviate</label></td>
                <td><label class="radio-label"><input type="radio" name="q${i}" value="2 deviate"> 2 deviate</label></td>
                <td><label class="radio-label"><input type="radio" name="q${i}" value="3 deviate"> 3 deviate</label></td>
                <td><label class="radio-label"><input type="radio" name="q${i}" value="4 or more deviate"> 4+ deviate</label></td>
            </tr>`;
            tbody.innerHTML += row;
        }

        startCountdown(totalAllowedTime);
    }

    function scoreQuiz() {
        if(isScored) return; 
        isScored = true;
        
        stopCountdown(); 
        let score = 0;
        let missing = 0;
        const timeUsed = Math.floor((new Date() - quizStartTime) / 1000);

        for (let i = 1; i <= numQuestions; i++) {
            let userAnswer = "";
            let correctAnswer = correctAnswers[i - 1];
            let row = document.getElementById(`row-${i}`);
            let ansCell = document.getElementById(`ans-${i}`);
            
            let str1Orig = document.getElementById(`str1-${i}`).innerText;
            let str2Orig = document.getElementById(`str2-${i}`).innerText;

            let radios = row.querySelectorAll('input[type="radio"]');
            
            for (let r of radios) {
                if (r.checked) userAnswer = r.value;
            }

            let [html1, html2] = getHighlightedStrings(str1Orig, str2Orig);
            document.getElementById(`str1-${i}`).innerHTML = html1;
            document.getElementById(`str2-${i}`).innerHTML = html2;

            radios.forEach(r => {
                r.disabled = true; 
                let label = r.parentElement;
                
                if (r.value === correctAnswer) {
                    label.classList.add('radio-correct'); 
                }
                
                if (r.checked) {
                    if (r.value === correctAnswer) {
                        ansCell.innerText = "✓ Correct";
                        ansCell.style.color = "#155724";
                        score++;
                    } else {
                        label.classList.add('radio-wrong'); 
                        ansCell.innerText = "✗ Wrong";
                        ansCell.style.color = "#721c24";
                    }
                }
            });

            if (userAnswer === "") {
                ansCell.innerText = "⏳ Missing";
                ansCell.style.color = "#856404";
                missing++;
            }
        }

        let accuracy = numQuestions > 0 ? Math.round((score / numQuestions) * 100) : 0;
        document.getElementById("res-score").innerText = `${score} / ${numQuestions}`;
        document.getElementById("res-accuracy").innerText = `${accuracy}%`;
        document.getElementById("res-time").innerText = `${timeUsed}s`;
        document.getElementById("res-missing").innerText = missing;
        document.getElementById("results-summary").style.display = "block";

        let summaryDiv = document.getElementById("results-summary");
        if (accuracy >= 80) summaryDiv.style.borderLeftColor = "#28a745"; 
        else if (accuracy >= 50) summaryDiv.style.borderLeftColor = "#ffc107"; 
        else summaryDiv.style.borderLeftColor = "#dc3545"; 

        let log = JSON.parse(localStorage.getItem('quizLog') || '[]');
        log.push({
            datetime: new Date().toLocaleString(),
            score: score,
            total: numQuestions,
            timeLimit: totalAllowedTime,
            timeUsed: timeUsed,
            missing: missing
        });
        localStorage.setItem('quizLog', JSON.stringify(log));

        document.getElementById("btnScore").disabled = true;
    }

    function getHighlightedStrings(str1, str2) {
        let html1 = "", html2 = "";
        const maxLen = Math.max(str1.length, str2.length);
        
        for (let i = 0; i < maxLen; i++) {
            let c1 = i < str1.length ? str1[i] : "";
            let c2 = i < str2.length ? str2[i] : "";
            
            if (c1 !== c2) {
                html1 += `<span class="diff-highlight">${c1}</span>`;
                html2 += `<span class="diff-highlight">${c2}</span>`;
            } else {
                html1 += c1;
                html2 += c2;
            }
        }
        return [html1, html2];
    }

    function startCountdown(totalSeconds) {
        quizStartTime = new Date();
        let endTime = new Date(quizStartTime.getTime() + (totalSeconds * 1000));
        
        stopTimer = false;
        document.getElementById("btnStop").style.display = "inline-block";
        document.getElementById("btnStop").disabled = false;
        document.getElementById("btnScore").disabled = false;
        document.getElementById("btnGenerate").disabled = true;

        let timerEl = document.getElementById("timer");

        timerInterval = setInterval(() => {
            let now = new Date();
            let remainingSec = Math.floor((endTime - now) / 1000);

            if (remainingSec <= 0) {
                remainingSec = 0;
                clearInterval(timerInterval);
                
                timerEl.innerText = "Time's Up!";
                timerEl.classList.add('times-up');
                
                scoreQuiz(); 
            } else {
                timerEl.innerText = `Time Remaining: ${remainingSec} sec`;
            }
        }, 100); 
    }

    function stopCountdown() {
        stopTimer = true;
        clearInterval(timerInterval);
        document.getElementById("btnStop").style.display = "none";
        document.getElementById("btnGenerate").disabled = false;
    }

    function randomMixedString(l) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@$%&#!";
        let str = "";
        for (let i = 0; i < l; i++) {
            str += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return str;
    }

    function makeSimilarString(baseStr) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@$%&#!";
        let strArr = baseStr.split(''); 
        let changes = Math.floor(Math.random() * 3) + 1; 
        
        for (let i = 0; i < changes; i++) {
            let pos = Math.floor(Math.random() * baseStr.length);
            strArr[pos] = chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return strArr.join('');
    }

    function getDeviationCategory(a, b) {
        let d = 0;
        const maxLen = Math.max(a.length, b.length);
        for (let i = 0; i < maxLen; i++) {
            if (a[i] !== b[i]) d++;
        }
        switch (d) {
            case 0: return "No-deviate";
            case 1: return "1 deviate";
            case 2: return "2 deviate";
            case 3: return "3 deviate";
            default: return "4 or more deviate";
        }
    }

    function showLog() {
        let log = JSON.parse(localStorage.getItem('quizLog') || '[]');
        let logBody = document.getElementById("logBody");
        logBody.innerHTML = "";
        log.reverse().forEach(entry => {
            let row = `<tr>
                <td>${entry.datetime}</td>
                <td>${entry.score}</td>
                <td>${entry.total}</td>
                <td>${entry.timeLimit}s</td>
                <td>${entry.timeUsed}s</td>
                <td>${entry.missing}</td>
            </tr>`;
            logBody.innerHTML += row;
        });
        document.getElementById("logModal").style.display = "block";
    }

    function closeLog() {
        document.getElementById("logModal").style.display = "none";
    }
</script>

</body>
</html>
